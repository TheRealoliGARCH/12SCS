name: Bayesian Regression Discontinuity Summary Hierarchical Pooling

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rd-summary-hierarchical-pooling:
    name: RD summary hierarchical pooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reconstruct summary bootstrap input
        run: python results/run_rd_summary_bootstrap.py

      - name: Run Bayesian RD hierarchical pooling
        run: python results/run_bayesian_rd_summary_hierarchical_pooling.py

      - name: Validate hierarchical pooling output
        run: |
          python - <<'PY'
          import csv
          import math
          from pathlib import Path

          p = Path('results/bayesian_rd_summary_hierarchical_pooling_v1.csv')
          assert p.exists() and p.stat().st_size > 0
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          assert len(rows) == 1
          r = rows[0]
          required = {
              'analysis','country_count','mu_prior_mean','mu_prior_sd',
              'kappa_prior_family','kappa_prior_sd','kappa_grid_max','kappa_grid_size',
              'posterior_mu_mean','posterior_mu_sd',
              'posterior_mu_q025_normal_approx','posterior_mu_median_approx',
              'posterior_mu_q975_normal_approx','posterior_mu_prob_negative',
              'posterior_mu_prob_positive','posterior_kappa_mean',
              'source_type','inference_level'
          }
          assert required.issubset(r)
          numeric = required - {'analysis','kappa_prior_family','source_type','inference_level'}
          for key in numeric:
              assert math.isfinite(float(r[key]))
          assert r['analysis'] == 'three_country_summary_pool'
          assert int(r['country_count']) == 3
          assert float(r['mu_prior_sd']) > 0.0
          assert r['kappa_prior_family'] == 'HalfNormal'
          assert float(r['kappa_prior_sd']) > 0.0
          assert int(r['kappa_grid_size']) > 100
          assert float(r['posterior_mu_sd']) > 0.0
          assert float(r['posterior_kappa_mean']) >= 0.0
          assert float(r['posterior_mu_q025_normal_approx']) <= float(r['posterior_mu_median_approx']) <= float(r['posterior_mu_q975_normal_approx'])
          pneg = float(r['posterior_mu_prob_negative'])
          ppos = float(r['posterior_mu_prob_positive'])
          assert 0.0 <= pneg <= 1.0
          assert 0.0 <= ppos <= 1.0
          assert abs((pneg + ppos) - 1.0) < 1e-9
          assert r['source_type'] == 'reported_estimate_and_standard_error'
          assert r['inference_level'] == 'summary_data_not_observation_level_rd'
          print('RD summary hierarchical pooling validated: RD_SUMMARY_HIERARCHICAL_POOLING_COMPLETE.')
          PY

      - name: Run hierarchical-pooling unit test
        run: python -m unittest tests.test_bayesian_rd_summary_hierarchical_pooling -v

      - name: Publish hierarchical-pooling artifact
        uses: actions/upload-artifact@v6
        with:
          name: 12scsm-bayesian-rd-summary-hierarchical-pooling-${{ github.sha }}
          path: results/bayesian_rd_summary_hierarchical_pooling_v1.csv
