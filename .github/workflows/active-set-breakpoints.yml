name: Active Set Breakpoint Analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  active-set:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Generate prerequisite gap data
        run: python results/run_gap_priority.py
      - name: Run active-set breakpoint analysis
        run: python results/run_active_set_breakpoints.py
      - name: Validate active-set outputs
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          b=list(csv.reader(Path('results/convergence_active_set_breakpoints_v2.csv').open(encoding='utf-8')))
          p=list(csv.reader(Path('results/convergence_active_set_path_v2.csv').open(encoding='utf-8')))
          assert b[0] == ['lambda','state_a','capability_a','state_b','capability_b','rank_crossover']
          assert p[0] == ['lambda','active_cell_count','active_cells','top_five_ranked_cells']
          assert len(p) >= 2
          for row in b[1:]:
              x=float(row[0]); assert math.isfinite(x) and 0.0 < x < 1.0
              assert row[5] == '1'
          for row in p[1:]:
              x=float(row[0]); n=int(row[1]); assert 0.0 <= x <= 1.0 and n >= 0
          print('Active-set breakpoint validation passed.')
          PY
      - name: Publish active-set artifact
        uses: actions/upload-artifact@v4
        with:
          name: 12scsm-active-set-breakpoints-${{ github.sha }}
          path: |
            results/convergence_active_set_breakpoints_v2.csv
            results/convergence_active_set_path_v2.csv
