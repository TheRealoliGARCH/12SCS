name: 12SCSM Polynomial Sign Certificates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Reconstruct validated derivatives
        run: |
          python results/run_gap_priority.py
          python results/run_active_set_breakpoints.py
          python results/run_active_set_regimes.py
          python results/run_exact_regime_value_functions.py
          python results/run_regime_derivatives_continuity.py
          python results/run_exact_breakpoint_intersections.py
          python results/run_exact_kink_analysis.py
      - name: Generate sign certificates
        run: python results/run_polynomial_sign_certificates.py
      - uses: actions/upload-artifact@v6
        with:
          name: 12scsm-polynomial-sign-certificates-${{ github.sha }}
          path: results/convergence_polynomial_sign_certificates_v2.csv
