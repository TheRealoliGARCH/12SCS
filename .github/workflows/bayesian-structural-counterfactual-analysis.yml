name: Bayesian Structural Counterfactual Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bayesian-structural-counterfactual:
    name: Bayesian structural counterfactual
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Reconstruct deterministic prerequisites
        run: |
          python results/run_gap_priority.py
          python results/run_active_set_breakpoints.py
          python results/run_active_set_regimes.py
          python results/run_active_set_regime_formulas.py
          python results/run_primitive_coefficient_map.py
          python results/run_primitive_counterfactual_coefficient_map.py
      - name: Generate canonical Bayesian input
        run: python results/run_bayesian_structural_counterfactual_input.py
      - name: Validate Bayesian input
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('results/bayesian_structural_counterfactual_cells_v1.csv')
          assert p.exists() and p.stat().st_size > 0
          rows=list(csv.DictReader(p.open(encoding='utf-8')))
          assert rows
          required={'A','B','C','D','E','F','D_cf_unit','E_cf_unit','lambda_start','lambda_end','d'}
          assert required.issubset(rows[0])
          for r in rows:
              for k in required: float(r[k])
          print(f'Bayesian input validated: {len(rows)} rows.')
          PY
      - name: Run Bayesian structural counterfactual analysis
        run: python results/run_bayesian_structural_counterfactual_analysis.py
      - name: Validate Bayesian output
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          p=Path('results/bayesian_structural_counterfactual_analysis_v1.csv')
          assert p.exists() and p.stat().st_size > 0
          rows=list(csv.DictReader(p.open(encoding='utf-8')))
          assert len(rows)==3
          required={'prior_a','prior_b','mean_delta','var_delta','contrast_intercept','contrast_slope','mean_contrast','var_contrast','contrast_at_delta_0','contrast_at_delta_1'}
          assert required.issubset(rows[0])
          variances=[]
          means=[]
          for r in rows:
              assert float(r['prior_a'])>0 and float(r['prior_b'])>0
              for k in required: assert math.isfinite(float(r[k]))
              variances.append(float(r['var_contrast']))
              means.append(float(r['mean_contrast']))
          assert all(v >= 0.0 for v in variances)
          assert max(variances)-min(variances) > 0.0
          assert max(means)-min(means) < 1e-12
          print('Bayesian structural counterfactual output validated: distinct prior variances, common prior mean.')
          PY
      - name: Run dedicated Bayesian input unit test
        run: python -m unittest tests.test_bayesian_structural_counterfactual_input -v
      - name: Publish Bayesian artifacts
        uses: actions/upload-artifact@v6
        with:
          name: 12scsm-bayesian-structural-counterfactual-${{ github.sha }}
          path: |
            results/bayesian_structural_counterfactual_cells_v1.csv
            results/bayesian_structural_counterfactual_analysis_v1.csv
