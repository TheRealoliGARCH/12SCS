name: 12SCSM Symbolic Regime Formulas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbolic-regime-formulas:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate prerequisite gap data
        run: python results/run_gap_priority.py
      - name: Generate active-set regimes
        run: python results/run_active_set_breakpoints.py && python results/run_active_set_regimes.py
      - name: Derive symbolic regime formulas
        run: python results/derive_symbolic_regime_formulas.py
      - name: Validate symbolic formulas
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          p = Path('results/convergence_symbolic_regime_formulas_v2.csv')
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          assert rows, 'no symbolic regime formulas generated'
          assert abs(float(rows[0]['lambda_start'])) < 1e-12
          assert abs(float(rows[-1]['lambda_end']) - 1.0) < 1e-12
          for a, b in zip(rows[:-1], rows[1:]):
              assert abs(float(a['lambda_end']) - float(b['lambda_start'])) < 1e-12
          for r in rows:
              for k in ('A','B','C','D','E','F','max_interior_error'):
                  assert math.isfinite(float(r[k]))
              assert float(r['max_interior_error']) < 1e-8
              assert r['binding_cells'] or r['marginal_cell']
          print(f'Symbolic regime formulas validated for {len(rows)} regimes.')
          PY
      - name: Publish symbolic formula artifact
        uses: actions/upload-artifact@v6
        with:
          name: 12scsm-symbolic-regime-formulas-${{ github.sha }}
          path: results/convergence_symbolic_regime_formulas_v2.csv
