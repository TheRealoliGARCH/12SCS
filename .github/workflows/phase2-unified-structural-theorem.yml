name: Phase II Unified Structural Theorem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-structural-theorem:
    name: Phase II unified structural theorem
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run unified structural theorem
        run: python results/run_phase2_unified_structural_theorem.py

      - name: Validate unified theorem artifact
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          p = Path('results/phase2_unified_structural_theorem_v1.csv')
          assert p.exists() and p.stat().st_size > 0
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          assert len(rows) == 10
          names = [r['theorem_component'] for r in rows]
          assert all(n.strip() for n in names)
          assert len(set(names)) == 10
          counts = {}
          for r in rows:
              counts[r['classification']] = counts.get(r['classification'], 0) + 1
          assert counts == {
              'established_domain_condition': 1,
              'exact_identity': 3,
              'necessary_and_sufficient': 1,
              'sufficient_not_necessary': 2,
              'sharpness_certified': 1,
              'structural_and_constructive': 1,
              'scope_boundary': 1,
          }
          assert {r['analysis'] for r in rows} == {'phase2_unified_structural_theorem'}
          assert {r['inference_level'] for r in rows} == {'phase2_unified_structural_theorem'}
          print('PHASE2 unified structural theorem validated: PHASE2_UNIFIED_STRUCTURAL_THEOREM_COMPLETE.')
          PY

      - name: Run unified theorem unit test
        run: python -m unittest tests.test_phase2_unified_structural_theorem -v

      - name: Re-run theorem for reproducibility
        run: |
          cp results/phase2_unified_structural_theorem_v1.csv /tmp/phase2_unified_structural_theorem_first.csv
          python results/run_phase2_unified_structural_theorem.py
          cmp /tmp/phase2_unified_structural_theorem_first.csv results/phase2_unified_structural_theorem_v1.csv

      - name: Publish unified theorem artifact
        uses: actions/upload-artifact@v6
        with:
          name: 12scs-phase2-unified-structural-theorem-${{ github.sha }}
          path: results/phase2_unified_structural_theorem_v1.csv
