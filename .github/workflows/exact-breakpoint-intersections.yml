name: 12SCSM Exact Breakpoint Intersections

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-intersections:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate prerequisite gap data
        run: python results/run_gap_priority.py
      - name: Generate active-set regimes
        run: python results/run_active_set_breakpoints.py && python results/run_active_set_regimes.py
      - name: Derive exact regime diagnostics
        run: python results/run_exact_regime_value_functions.py
      - name: Derive regime derivatives
        run: python results/run_regime_derivatives_continuity.py
      - name: Recover exact adjacent intersections
        run: python results/run_exact_breakpoint_intersections.py
      - name: Validate intersections
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          p = Path('results/convergence_exact_breakpoint_intersections_v2.csv')
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          assert rows, 'no intersections generated'
          for r in rows:
              for k in ('reported_lambda','exact_intersection','local_error','value_left','value_right','value_gap'):
                  assert math.isfinite(float(r[k]))
              assert float(r['exact_intersection']) >= 0.0
              assert float(r['exact_intersection']) <= 1.0
              assert float(r['value_gap']) <= 1e-7
          print(f'Exact adjacent intersections validated for {len(rows)} boundaries.')
          PY
      - name: Publish exact intersection artifact
        uses: actions/upload-artifact@v6
        with:
          name: 12scsm-exact-breakpoint-intersections-${{ github.sha }}
          path: results/convergence_exact_breakpoint_intersections_v2.csv
