name: Phase II Sharpness Classification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sharpness-classification:
    name: Phase II sharpness classification
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run sharpness classification theorem
        run: python results/run_phase2_sharpness_classification.py
      - name: Validate sharpness classification artifact
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('results/phase2_sharpness_classification_v1.csv')
          assert p.exists() and p.stat().st_size > 0
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          assert len(rows) == 9
          names = [r['theorem_component'] for r in rows]
          assert all(n.strip() for n in names)
          assert len(set(names)) == 9
          counts = {}
          for r in rows:
              counts[r['classification']] = counts.get(r['classification'], 0) + 1
          assert counts == {
              'necessary_and_sufficient': 1,
              'sufficient_not_necessary': 2,
              'coefficient_level_nonnecessary': 1,
              'constructively_nonnecessary': 3,
              'structurally_unrealizable': 1,
              'scope': 1,
          }
          assert {r['analysis'] for r in rows} == {'phase2_sharpness_classification'}
          assert {r['inference_level'] for r in rows} == {'sharpness_classification'}
          print('PHASE2 sharpness classification validated: PHASE2_SHARPNESS_CLASSIFICATION_COMPLETE.')
          PY
      - name: Run sharpness classification unit test
        run: python -m unittest tests.test_phase2_sharpness_classification -v
      - name: Re-run classification for reproducibility
        run: |
          cp results/phase2_sharpness_classification_v1.csv /tmp/phase2_sharpness_classification_first.csv
          python results/run_phase2_sharpness_classification.py
          cmp /tmp/phase2_sharpness_classification_first.csv results/phase2_sharpness_classification_v1.csv
      - name: Publish sharpness classification artifact
        uses: actions/upload-artifact@v6
        with:
          name: 12scs-phase2-sharpness-classification-${{ github.sha }}
          path: results/phase2_sharpness_classification_v1.csv
