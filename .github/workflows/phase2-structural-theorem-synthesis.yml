name: Phase II Structural Theorem Synthesis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-theorem-synthesis:
    name: Phase II structural theorem synthesis
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run structural theorem synthesis
        run: python results/run_phase2_structural_theorem_synthesis.py

      - name: Validate structural theorem artifact
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          p = Path('results/phase2_structural_theorem_synthesis_v1.csv')
          assert p.exists() and p.stat().st_size > 0
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          assert len(rows) == 10
          required = {
              'analysis', 'theorem_component', 'conditions_or_definition',
              'conclusion', 'status'
          }
          assert required.issubset(rows[0])
          components = {r['theorem_component'] for r in rows}
          assert components == {
              'pole_exclusion', 'first_derivative', 'coefficients',
              'curvature_bridge', 'convex_endpoint_certificate',
              'concave_discriminant_certificate', 'linear_certificate',
              'curvature_to_discriminant', 'degenerate_branch',
              'curvature_neutral_branch'
          }
          for r in rows:
              assert r['analysis'] == 'phase2_structural_theorem_synthesis'
          assert sum(r['status'] == 'exact' for r in rows) == 4
          assert sum(r['status'] == 'sufficient' for r in rows) == 3
          assert sum(r['status'] == 'exact sign implication' for r in rows) == 1
          assert sum(r['status'] == 'strict positivity of denominator' for r in rows) == 1
          assert sum(r['status'] == 'coefficient reduction' for r in rows) == 1
          by_name = {r['theorem_component']: r for r in rows}
          assert by_name['curvature_bridge']['conclusion'] == 'Delta_P=4*S*T=2*S*q0'
          assert by_name['degenerate_branch']['conclusion'] == 'p1=p2=0 and Delta_P=0'
          assert by_name['curvature_neutral_branch']['conclusion'] == 'Delta_P=0'
          print('PHASE2 structural theorem synthesis validated: PHASE2_STRUCTURAL_THEOREM_SYNTHESIS_COMPLETE.')
          PY

      - name: Run structural theorem synthesis unit test
        run: python -m unittest tests.test_phase2_structural_theorem_synthesis -v

      - name: Re-run synthesis for reproducibility
        run: |
          cp results/phase2_structural_theorem_synthesis_v1.csv /tmp/phase2_structural_theorem_synthesis_first.csv
          python results/run_phase2_structural_theorem_synthesis.py
          cmp /tmp/phase2_structural_theorem_synthesis_first.csv results/phase2_structural_theorem_synthesis_v1.csv

      - name: Publish structural theorem artifact
        uses: actions/upload-artifact@v6
        with:
          name: 12scs-phase2-structural-theorem-synthesis-${{ github.sha }}
          path: results/phase2_structural_theorem_synthesis_v1.csv
