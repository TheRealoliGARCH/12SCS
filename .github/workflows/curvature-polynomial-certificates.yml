name: 12SCSM Curvature Polynomial Certificates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  curvature-certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Reconstruct validated derivatives
        run: |
          python results/run_gap_priority.py
          python results/run_active_set_breakpoints.py
          python results/run_active_set_regimes.py
          python results/run_exact_regime_value_functions.py
          python results/run_regime_derivatives_continuity.py
      - name: Generate curvature certificates
        run: python results/run_curvature_polynomial_certificates.py
      - name: Validate certificates
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          p=Path('results/convergence_curvature_polynomial_certificates_v2.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8')))
          assert rows
          for r in rows:
              for k in ('q0','q1','q2','q_min','q_max'):
                  assert math.isfinite(float(r[k]))
              assert r['curvature_certificate'] in {'STRICTLY_CONVEX','STRICTLY_CONCAVE','CURVATURE-CHANGE-OR-ZERO','ZERO/UNRESOLVED'}
          print(f'Validated curvature certificates for {len(rows)} regimes.')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: 12scsm-curvature-certificates-${{ github.sha }}
          path: results/convergence_curvature_polynomial_certificates_v2.csv
