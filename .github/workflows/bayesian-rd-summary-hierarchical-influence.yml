name: Bayesian Regression Discontinuity Summary Hierarchical Influence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rd-summary-hierarchical-influence:
    name: RD summary hierarchical influence
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reconstruct summary bootstrap input
        run: python results/run_rd_summary_bootstrap.py

      - name: Run full hierarchical pooling
        run: python results/run_bayesian_rd_summary_hierarchical_pooling.py

      - name: Run hierarchical leave-one-out analysis
        run: python results/run_bayesian_rd_summary_hierarchical_leave_one_out.py

      - name: Run hierarchical influence diagnostic
        run: python results/run_bayesian_rd_summary_hierarchical_influence.py

      - name: Validate hierarchical influence output
        run: |
          python - <<'PY'
          import csv
          import math
          from pathlib import Path

          p = Path('results/bayesian_rd_summary_hierarchical_influence_v1.csv')
          assert p.exists() and p.stat().st_size > 0
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          assert len(rows) == 3
          required = {
              'analysis','omitted_country','full_posterior_mu_mean',
              'leave_one_out_posterior_mu_mean','delta_posterior_mu_mean',
              'full_posterior_mu_sd','leave_one_out_posterior_mu_sd',
              'delta_posterior_mu_sd','standardized_mean_shift_full_sd',
              'full_posterior_mu_prob_negative',
              'leave_one_out_posterior_mu_prob_negative',
              'delta_posterior_mu_prob_negative','absolute_mean_shift',
              'absolute_sign_probability_shift','source_type','inference_level'
          }
          assert required.issubset(rows[0])
          assert {r['omitted_country'] for r in rows} == {'Pakistan','Israel','North Korea'}
          for r in rows:
              assert r['analysis'] == 'bayesian_rd_summary_hierarchical_influence'
              full_mu = float(r['full_posterior_mu_mean'])
              loo_mu = float(r['leave_one_out_posterior_mu_mean'])
              full_sd = float(r['full_posterior_mu_sd'])
              loo_sd = float(r['leave_one_out_posterior_mu_sd'])
              assert math.isfinite(full_mu) and math.isfinite(loo_mu)
              assert full_sd > 0.0 and loo_sd > 0.0
              assert abs(float(r['delta_posterior_mu_mean']) - (loo_mu - full_mu)) < 1e-12
              assert abs(float(r['delta_posterior_mu_sd']) - (loo_sd - full_sd)) < 1e-12
              assert abs(float(r['standardized_mean_shift_full_sd']) - (loo_mu - full_mu) / full_sd) < 1e-12
              p0 = float(r['full_posterior_mu_prob_negative'])
              p1 = float(r['leave_one_out_posterior_mu_prob_negative'])
              assert 0.0 <= p0 <= 1.0 and 0.0 <= p1 <= 1.0
              assert abs(float(r['delta_posterior_mu_prob_negative']) - (p1 - p0)) < 1e-12
              assert abs(float(r['absolute_mean_shift']) - abs(loo_mu - full_mu)) < 1e-12
              assert abs(float(r['absolute_sign_probability_shift']) - abs(p1 - p0)) < 1e-12
              assert r['source_type'] == 'reported_estimate_and_standard_error'
              assert r['inference_level'] == 'summary_data_hierarchical_influence'
          print('RD summary hierarchical influence validated: RD_SUMMARY_HIERARCHICAL_INFLUENCE_COMPLETE.')
          PY

      - name: Run hierarchical influence unit test
        run: python -m unittest tests.test_bayesian_rd_summary_hierarchical_influence -v

      - name: Publish hierarchical influence artifact
        uses: actions/upload-artifact@v6
        with:
          name: 12scsm-bayesian-rd-summary-hierarchical-influence-${{ github.sha }}
          path: results/bayesian_rd_summary_hierarchical_influence_v1.csv
