name: Phase III Primitive Curvature Sharpness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primitive-curvature-sharpness:
    name: Phase III primitive curvature sharpness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install --upgrade pip numpy

      - name: Reconstruct primitive-map prerequisites
        run: |
          python results/run_gap_priority.py
          python results/run_active_set_breakpoints.py
          python results/run_active_set_regimes.py
          python results/run_active_set_regime_formulas.py
          python results/run_primitive_coefficient_map.py

      - name: Run primitive curvature sharpness witnesses
        run: python results/run_phase3_primitive_curvature_sharpness.py

      - name: Validate primitive curvature sharpness artifact
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          p = Path('results/phase3_primitive_curvature_sharpness_v1.csv')
          assert p.exists() and p.stat().st_size > 0
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          assert len(rows) == 3
          assert [r['witness_type'] for r in rows] == [
              'strictly_convex', 'affine', 'strictly_concave'
          ]
          assert len({r['witness_type'] for r in rows}) == 3
          assert {r['analysis'] for r in rows} == {'phase3_primitive_curvature_sharpness'}
          assert {r['inference_level'] for r in rows} == {'constructive_primitive_witness'}
          allowed = {'realized_by_primitive_map', 'not_witnessed_in_current_map'}
          assert {r['attainability'] for r in rows}.issubset(allowed)
          for r in rows:
              if r['attainability'] == 'realized_by_primitive_map':
                  C, D, E, F, T = (float(r[k]) for k in ('C','D','E','F','T'))
                  assert abs(T - (E - F*D + F*F*C)) <= 1e-12
                  if r['witness_type'] == 'strictly_convex': assert T > 0
                  elif r['witness_type'] == 'affine': assert T == 0
                  else: assert T < 0
              else:
                  assert all(r[k] == '' for k in ('regime','C','D','E','F','T'))
          print('PHASE3 primitive curvature sharpness validated: PHASE3_PRIMITIVE_CURVATURE_SHARPNESS_COMPLETE.')
          PY

      - name: Run primitive curvature sharpness unit test
        run: python -m unittest tests.test_phase3_primitive_curvature_sharpness -v

      - name: Re-run witnesses for reproducibility
        run: |
          cp results/phase3_primitive_curvature_sharpness_v1.csv /tmp/phase3_primitive_curvature_sharpness_first.csv
          python results/run_phase3_primitive_curvature_sharpness.py
          cmp /tmp/phase3_primitive_curvature_sharpness_first.csv results/phase3_primitive_curvature_sharpness_v1.csv

      - name: Publish primitive curvature sharpness artifact
        uses: actions/upload-artifact@v6
        with:
          name: 12scs-phase3-primitive-curvature-sharpness-${{ github.sha }}
          path: results/phase3_primitive_curvature_sharpness_v1.csv
