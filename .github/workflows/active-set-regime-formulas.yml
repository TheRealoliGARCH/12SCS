name: 12SCSM Active-Set Regime Mechanics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regime-mechanics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate prerequisite gap data
        run: python results/run_gap_priority.py
      - name: Generate active-set regimes
        run: python results/run_active_set_breakpoints.py && python results/run_active_set_regimes.py
      - name: Derive regime mechanics
        run: python results/run_active_set_regime_formulas.py
      - name: Derive primitive coefficient map
        run: python results/run_primitive_coefficient_map.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate regime mechanics and structural identities
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          regime_path = Path('results/convergence_active_set_regimes_v2.csv')
          mechanics_path = Path('results/convergence_active_set_regime_formulas_v2.csv')
          coeff_path = Path('results/convergence_primitive_coefficient_map_v1.csv')
          regimes = list(csv.DictReader(regime_path.open(encoding='utf-8')))
          rows = list(csv.DictReader(mechanics_path.open(encoding='utf-8')))
          coeffs = list(csv.DictReader(coeff_path.open(encoding='utf-8')))
          assert regimes and rows and coeffs
          assert len(rows) == len(regimes) == len(coeffs)
          assert abs(float(rows[0]['lambda_start'])) < 1e-12
          assert abs(float(rows[-1]['lambda_end']) - 1.0) < 1e-12
          for a, b in zip(rows[:-1], rows[1:]):
              assert abs(float(a['lambda_end']) - float(b['lambda_start'])) < 1e-12
          for r, c in zip(rows, coeffs):
              for k in ('lambda_start','lambda_end','budget_residual','progress_start','progress_mid','progress_end'):
                  assert math.isfinite(float(r[k]))
              for k in ('A','B','C','D','E','F','p0','p1','p2','q0','q1','q2','Delta_P','Delta_Q','S','T','r0','r1','r2'):
                  assert math.isfinite(float(c[k]))
              assert abs(float(c['p1']) - 2.0*float(c['S'])) < 1e-8
              assert abs(float(c['p2']) - float(c['F'])*float(c['S'])) < 1e-8
              assert abs(float(c['Delta_P']) - 4.0*float(c['S'])*float(c['T'])) < 1e-7
              assert abs(float(c['q0']) - 2.0*float(c['T'])) < 1e-8
              assert abs(float(c['Delta_P']) - 2.0*float(c['B'])*float(c['F'])*float(c['q0']) - 2.0*float(c['E'])*float(c['q0'])) < 1e-7
              assert abs(float(c['q1'])) < 1e-12
              assert abs(float(c['q2'])) < 1e-12
              assert abs(float(c['Delta_Q'])) < 1e-12
          print(f'Primitive coefficient validation passed: {len(coeffs)} regimes.')
          PY
      - name: Publish regime and primitive-map artifacts
        uses: actions/upload-artifact@v6
        with:
          name: 12scsm-phase2-primitive-coefficient-map-${{ github.sha }}
          path: |
            results/convergence_active_set_regimes_v2.csv
            results/convergence_active_set_regime_formulas_v2.csv
            results/convergence_primitive_coefficient_map_v1.csv
            results/primitive_coefficient_map_v1.txt
