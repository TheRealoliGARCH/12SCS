name: 12SCSM Regime Derivatives and Continuity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regime-derivatives:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate prerequisite gap data
        run: python results/run_gap_priority.py
      - name: Generate active-set regimes
        run: python results/run_active_set_breakpoints.py && python results/run_active_set_regimes.py
      - name: Derive exact regime diagnostics
        run: python results/run_exact_regime_value_functions.py
      - name: Derive derivatives and continuity
        run: python results/run_regime_derivatives_continuity.py
      - name: Validate derivatives and continuity
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          p = Path('results/convergence_regime_derivatives_continuity_v2.csv')
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          assert rows, 'no derivative rows generated'
          assert abs(float(rows[0]['lambda_start'])) < 1e-12
          assert abs(float(rows[-1]['lambda_end']) - 1.0) < 1e-12
          for a, b in zip(rows[:-1], rows[1:]):
              assert abs(float(a['lambda_end']) - float(b['lambda_start'])) < 1e-12
          for r in rows:
              for k in ('A','B','C','D','E','F','dPi_start','dPi_mid','dPi_end','ddPi_mid'):
                  assert math.isfinite(float(r[k]))
          print(f'Derivative and continuity validation passed for {len(rows)} regimes.')
          PY
      - name: Publish derivative artifact
        uses: actions/upload-artifact@v6
        with:
          name: 12scsm-regime-derivatives-continuity-${{ github.sha }}
          path: results/convergence_regime_derivatives_continuity_v2.csv
