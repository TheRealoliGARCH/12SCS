name: 12SCSM V6 Reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v6-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Record clean checkout
        run: |
          test -z "$(git status --porcelain)"
          git rev-parse HEAD | tee /tmp/v6_commit.txt

      - name: Run complete unit-test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Reconstruct prerequisite gap data
        run: python results/run_gap_priority.py

      - name: Reconstruct active-set breakpoints and regimes
        run: |
          python results/run_active_set_breakpoints.py
          python results/run_active_set_regimes.py

      - name: Reconstruct exact regime mechanics
        run: python results/run_active_set_regime_formulas.py

      - name: Reconstruct primitive coefficient map
        run: python results/run_primitive_coefficient_map.py

      - name: Reconstruct Phase II theorem diagnostics
        run: python results/run_phase2_active_set_theorem_diagnostics.py

      - name: Validate numerical finiteness and structural identities
        run: |
          python - <<'PY'
          import csv
          import math
          from pathlib import Path

          files = [
              Path('results/capability_gap_positive_v2.csv'),
              Path('results/capability_dispersion_weights_v2.csv'),
              Path('results/convergence_active_set_regime_formulas_v2.csv'),
              Path('results/convergence_primitive_coefficient_map_v1.csv'),
              Path('results/phase2_active_set_theorem_diagnostics_v1.csv'),
          ]
          for path in files:
              assert path.exists(), f'missing artifact: {path}'
              assert path.stat().st_size > 0, f'empty artifact: {path}'

          coeffs = list(csv.DictReader(files[3].open(encoding='utf-8')))
          assert coeffs, 'primitive coefficient map is empty'
          for c in coeffs:
              for k in ('A','B','C','D','E','F','p0','p1','p2','q0','q1','q2','Delta_P','Delta_Q','S','T','r0','r1','r2'):
                  assert math.isfinite(float(c[k])), (c, k)
              assert abs(float(c['p1']) - 2.0 * float(c['S'])) < 1e-8
              assert abs(float(c['p2']) - float(c['F']) * float(c['S'])) < 1e-8
              assert abs(float(c['q1'])) < 1e-12
              assert abs(float(c['q2'])) < 1e-12
              assert abs(float(c['Delta_Q'])) < 1e-12
              assert abs(float(c['Delta_P']) - 4.0 * float(c['S']) * float(c['T'])) < 1e-7
              assert abs(float(c['q0']) - 2.0 * float(c['T'])) < 1e-8
          print(f'Validated {len(coeffs)} primitive coefficient regimes.')
          PY

      - name: Capture first reconstruction hashes
        run: |
          mkdir -p /tmp/v6-first
          cp results/capability_gap_positive_v2.csv /tmp/v6-first/
          cp results/capability_dispersion_weights_v2.csv /tmp/v6-first/
          cp results/convergence_active_set_regimes_v2.csv /tmp/v6-first/
          cp results/convergence_active_set_regime_formulas_v2.csv /tmp/v6-first/
          cp results/convergence_primitive_coefficient_map_v1.csv /tmp/v6-first/
          cp results/primitive_coefficient_map_v1.txt /tmp/v6-first/
          cp results/phase2_active_set_theorem_diagnostics_v1.csv /tmp/v6-first/
          (cd /tmp/v6-first && sha256sum * | sort) > /tmp/v6-first.sha256

      - name: Repeat clean-room reconstruction
        run: |
          rm -f \
            results/capability_gap_positive_v2.csv \
            results/capability_dispersion_weights_v2.csv \
            results/convergence_active_set_breakpoints_v2.csv \
            results/convergence_active_set_regimes_v2.csv \
            results/convergence_active_set_regime_formulas_v2.csv \
            results/convergence_primitive_coefficient_map_v1.csv \
            results/primitive_coefficient_map_v1.txt \
            results/phase2_active_set_theorem_diagnostics_v1.csv
          python results/run_gap_priority.py
          python results/run_active_set_breakpoints.py
          python results/run_active_set_regimes.py
          python results/run_active_set_regime_formulas.py
          python results/run_primitive_coefficient_map.py
          python results/run_phase2_active_set_theorem_diagnostics.py

      - name: Verify bit-for-bit reproducibility
        run: |
          mkdir -p /tmp/v6-second
          cp results/capability_gap_positive_v2.csv /tmp/v6-second/
          cp results/capability_dispersion_weights_v2.csv /tmp/v6-second/
          cp results/convergence_active_set_regimes_v2.csv /tmp/v6-second/
          cp results/convergence_active_set_regime_formulas_v2.csv /tmp/v6-second/
          cp results/convergence_primitive_coefficient_map_v1.csv /tmp/v6-second/
          cp results/primitive_coefficient_map_v1.txt /tmp/v6-second/
          cp results/phase2_active_set_theorem_diagnostics_v1.csv /tmp/v6-second/
          (cd /tmp/v6-second && sha256sum * | sort) > /tmp/v6-second.sha256
          diff -u /tmp/v6-first.sha256 /tmp/v6-second.sha256
          cmp /tmp/v6-first/convergence_primitive_coefficient_map_v1.csv /tmp/v6-second/convergence_primitive_coefficient_map_v1.csv
          echo 'V6 bit-for-bit reproducibility: PASS'

      - name: Create reproducibility manifest
        run: |
          {
            echo '12SCSM V6 REPRODUCIBILITY MANIFEST'
            echo "commit=$(cat /tmp/v6_commit.txt)"
            echo 'python=3.12'
            echo 'dependencies=requirements.txt'
            echo 'reconstruction=two independent executions in one clean runner'
            echo 'determinism=bit-for-bit artifact equality'
            echo 'structural_checks=p1,p2,q0,q1,q2,Delta_P,Delta_Q'
            echo 'phase2_curvature=q1=q2=Delta_Q=0'
            echo
            cat /tmp/v6-first.sha256
          } > results/v6_reproducibility_manifest.txt

      - name: Publish V6 reproducibility artifacts
        uses: actions/upload-artifact@v6
        with:
          name: 12scsm-v6-reproducibility-${{ github.sha }}
          path: |
            results/convergence_active_set_regimes_v2.csv
            results/convergence_active_set_regime_formulas_v2.csv
            results/convergence_primitive_coefficient_map_v1.csv
            results/primitive_coefficient_map_v1.txt
            results/phase2_active_set_theorem_diagnostics_v1.csv
            results/v6_reproducibility_manifest.txt
