name: 12SCSM Exact Regime Value Functions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-regime-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate prerequisite gap data
        run: python results/run_gap_priority.py
      - name: Generate active-set regimes
        run: python results/run_active_set_breakpoints.py && python results/run_active_set_regimes.py
      - name: Derive exact regime diagnostics
        run: python results/run_exact_regime_value_functions.py
      - name: Validate exact regime diagnostics
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          p = Path('results/convergence_exact_regime_value_functions_v2.csv')
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          assert rows, 'no exact-regime rows generated'
          assert abs(float(rows[0]['lambda_start'])) < 1e-12
          assert abs(float(rows[-1]['lambda_end']) - 1.0) < 1e-12
          for a, b in zip(rows[:-1], rows[1:]):
              assert abs(float(a['lambda_end']) - float(b['lambda_start'])) < 1e-12
          for r in rows:
              for k in ('lambda_start','lambda_end','progress_start','progress_mid','progress_end','left_right_gap'):
                  assert math.isfinite(float(r[k]))
              assert int(r['regime']) >= 0
              assert r['active_cells']
          print(f'Exact-regime diagnostics validated for {len(rows)} regimes.')
          PY
      - name: Publish exact regime artifact
        uses: actions/upload-artifact@v6
        with:
          name: 12scsm-exact-regime-functions-${{ github.sha }}
          path: results/convergence_exact_regime_value_functions_v2.csv
