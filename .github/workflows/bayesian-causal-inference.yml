name: 12SCSM Bayesian Causal Inference

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'results/run_bayesian_causal_inference.py'
      - 'tests/test_bayesian_causal_inference.py'
      - '.github/workflows/bayesian-causal-inference.yml'
      - 'requirements.txt'

jobs:
  bayesian-causal-inference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest tests.test_bayesian_causal_inference -v
      - name: Run Bayesian causal baseline
        run: python results/run_bayesian_causal_inference.py
      - name: Validate posterior artifact
        run: |
          test -s results/bayesian_causal_inference_v1.csv
          python - <<'PY'
          import csv, math
          from pathlib import Path
          p = Path('results/bayesian_causal_inference_v1.csv')
          row = next(csv.DictReader(p.open(encoding='utf-8')))
          for key in row:
              assert math.isfinite(float(row[key])), (key, row[key])
          assert 0.0 <= float(row['p_ate_positive']) <= 1.0
          assert float(row['ate_sd']) > 0.0
          print('Bayesian causal posterior artifact: PASS')
          PY
      - name: Verify deterministic posterior reconstruction
        run: |
          cp results/bayesian_causal_inference_v1.csv /tmp/bci-first.csv
          python results/run_bayesian_causal_inference.py
          cmp /tmp/bci-first.csv results/bayesian_causal_inference_v1.csv
          echo 'Bayesian causal deterministic reconstruction: PASS'
      - name: Publish posterior artifact
        uses: actions/upload-artifact@v6
        with:
          name: bayesian-causal-inference-v1
          path: results/bayesian_causal_inference_v1.csv
